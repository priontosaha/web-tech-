<!DOCTYPE html>
<html>
<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initiald-scale=1.0">
    <title> Regristration Form </title>
</head>

<body>
<h2>
    Regristration Form
    <h2>
        <form action="#" method="post">
            <label for="fullname">Full Name: </label><br>
            <label type="text" id="fullname" name="fullname" required><br><br>

            <label for="email">Email</label><br>
            <label type="email" id="email" name="email" required><br><br>

            <label for="phone">Phone Number</label><br>
            <label type="tel" id="phone" name="phone" required><br><br> 


            <label>Gender:</label><br>

            <label type="radio" id="male" name="gender" value="Male"><br><br>
            <label for="male">Male</label><br>  \

            <label type="radio" id="female" name="gender" value="Female"><br><br>
            <label for="female">Female</label><br> 
            
            <label type="radio" id="other" name="gender" value="Other"><br><br>
            <label for="other">Other</label><br>  

            <label for="dob">Date Of Birth</label><br>
            <label type="date" id="dob" name="dob"><br><br>
                
            <label for="password">Password:</label><br>
            <label type="password" id="password" name="password" required><br><br> 

            <label for="confirmPassword">Confirm Passwowrd : </label><br>
            <label type="confirmPassword" id="confirmPassword" name="confirmPassword" required><br><br> 

            <label for="address">Address :</label><br>
            <textarea id="address" name="address" rows="4"></textarea><br><br>
            
            <label for="department">Department:</label><br>
            <select id="department" name="department">
                <option value="=CSE">CSE</option>
                <option value="=EEE">EEE</option>
                <option value="=BBA">BBA</option>
                <option value="=LLB">LLB</option>
            </select><br><br>

            <input type="checkbox" id="terms" name="terms" required>
            <label for="terms">I agree to the Terms</label><br><br>

            <input type="submit" value="Register";>
            <input type="reset" value="Reset">

        </form>
</body>
</html>
